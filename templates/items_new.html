{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-3">
  <h1 class="h4 m-0">品目を追加</h1>
  <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('items_list') }}">戻る</a>
</div>

<div class="card shadow-sm">
  <div class="card-body">

    <form method="post" action="{{ url_for('items_create') }}" class="needs-validation" novalidate>

      <div class="row g-3">
        <!-- 品目名 -->
        <div class="col-12">
          <label class="form-label fw-semibold">品目名</label>
          <input
            type="text"
            name="name"
            class="form-control"
            placeholder="例：ミルク / コーヒー豆 / 紙コップ"
            value="{{ request.form.get('name','') }}"
            required
          >
          <div class="form-text">他と同じ名前は登録できません。</div>
        </div>

        <!-- カテゴリ -->
        <div class="col-12 col-md-6">
          <label class="form-label fw-semibold">カテゴリ</label>
          <select name="category" class="form-select" required>
            {% set cat = request.form.get('category', 'ingredient') %}
            <option value="ingredient" {% if cat == 'ingredient' %}selected{% endif %}>食材</option>
            <option value="consumable" {% if cat == 'consumable' %}selected{% endif %}>消耗品</option>
          </select>
          <div class="form-text"></div>
        </div>

        <!-- 単位 -->
        <div class="col-12 col-md-6">
          <label class="form-label fw-semibold">単位</label>
          <input
            type="text"
            name="unit"
            class="form-control"
            placeholder="例：g / ml / 個 / 袋"
            value="{{ request.form.get('unit','') }}"
            required
          >
        </div>

        <!-- 目安（通知しきい値） -->
        <div class="col-12 col-md-6">
          <label class="form-label fw-semibold">目安（これ未満で通知）</label>
          <input
            type="number"
            name="reorder_point"
            class="form-control"
            step="0.01"
            min="0"
            placeholder="例：10"
            value="{{ request.form.get('reorder_point','0') }}"
          >
          <div class="form-text">0 にすると通知しません。</div>
        </div>

        <!-- 保管場所 -->
        <div class="col-12 col-md-6">
          <label class="form-label fw-semibold">保管場所</label>
          <select name="default_location_id" class="form-select">
            <option value="">（未設定）</option>
            {% set loc = (request.form.get('default_location_id','') or '') %}
            {% for l in locations %}
              <option value="{{ l['id'] }}" {% if loc == (l['id'] ~ '') %}selected{% endif %}>{{ l['name'] }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- ロット管理 -->
        <div class="col-12">
          <div class="form-check">
            {% set tl = request.form.get('track_lots','0') %}
            <input class="form-check-input" type="checkbox" value="1" id="trackLots" name="track_lots"
                   {% if tl == '1' %}checked{% endif %}>
            <label class="form-check-label fw-semibold" for="trackLots">
              ロット管理する（賞味期限などを分けたいとき）
            </label>
          </div>
          <div class="text-muted small mt-1">今すぐ使わないならOFFのままでOK。</div>
        </div>

        <!-- ボタン -->
        <div class="col-12">
          <div class="d-flex gap-2 flex-wrap mt-2">
            <button class="btn btn-accent" type="submit">追加する</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('items_list') }}">キャンセル</a>
          </div>
        </div>
      </div>

    </form>

  </div>
</div>

<!-- bootstrapのバリデーション（見た目だけ。サーバ側バリデーションは今のままでOK） -->
<script>
(() => {
  'use strict';
  const forms = document.querySelectorAll('.needs-validation');
  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
      }
      form.classList.add('was-validated');
    }, false);
  });
})();
</script>

{% endblock %}
