<!-- templates/items_new.html -->
{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-3">
  <h1 class="h4 m-0">品目を追加</h1>
  <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('items_list') }}">戻る</a>
</div>

<div class="card shadow-sm">
  <div class="card-body">

    <form method="post" action="{{ url_for('items_create') }}" class="row g-3">

      <div class="col-12">
        <label class="form-label fw-semibold">品目名</label>
        <input class="form-control" type="text" name="name" required placeholder="例：コーヒー豆">
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label fw-semibold">カテゴリ</label>
<select class="form-select" name="category">
  <option value="ingredient" selected>食材（材料）</option>
  <option value="consumable">消耗品（紙コップ等）</option>
</select>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label fw-semibold">単位</label>
        <input class="form-control" type="text" name="unit" required placeholder="例：袋 / g / L">
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label fw-semibold">目安（この数より下で通知）</label>
        <input class="form-control" type="number" name="reorder_point" step="0.01" min="0" value="0">
        <div class="form-text">0 のときは通知しません。</div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label fw-semibold">保管場所（任意）</label>
        <select class="form-select" name="default_location_id">
          <option value="">未指定</option>
          {% for loc in locations %}
            <option value="{{ loc['id'] }}">{{ loc['name'] }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="1" id="track_lots" name="track_lots">
          <label class="form-check-label" for="track_lots">
            ロット管理（任意）
          </label>
        </div>
      </div>

      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary" type="submit">登録</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('items_list') }}">キャンセル</a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
